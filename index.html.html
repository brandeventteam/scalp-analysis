<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr.FORHAIR · 찾아가는 두피진단</title>
<style>
:root{--red:#E11428;--card:#fff;--ink:#1a1a1a;--sub:#5a5a5a;--line:#e8e8e8;--chip:#fdecee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1f1f1f;--ink:#f3f3f3;--sub:#b8b8b8;--line:#333;--chip:#3a1a1d}}
:root[data-theme="dark"]{--card:#1f1f1f;--ink:#f3f3f3;--sub:#b8b8b8;--line:#333;--chip:#3a1a1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--red);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Noto Sans SC","Noto Sans JP","Apple SD Gothic Neo","PingFang SC","Hiragino Sans",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:28px 20px 36px}
.head{text-align:center;color:#fff;margin-bottom:22px}
.eyebrow{font-style:italic;font-weight:800;font-size:20px;letter-spacing:.02em}
.head h1{margin:2px 0 6px;font-size:34px;line-height:1.2;font-weight:900}
.head p{margin:0;font-size:15px;opacity:.92}
.card{background:var(--card);border-radius:20px;padding:22px 20px}
.langs{display:flex;flex-direction:column;gap:12px}
.lang{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:58px;padding:0 20px;border:2px solid var(--red);border-radius:16px;background:var(--card);color:var(--red);font:inherit;font-size:19px;font-weight:700;cursor:pointer}
.lang:active{background:var(--chip)}
.lang span:last-child{font-size:22px}
.pick{margin:0 0 14px;text-align:center;color:var(--sub);font-size:14px}
.sec{margin:0 0 10px;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--red)}
ol{list-style:none;margin:0 0 22px;padding:0}
ol li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px}
ol li:last-child{border-bottom:0}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:1px}
ul{margin:0 0 24px;padding:14px 16px 14px 34px;background:var(--chip);border-radius:14px;font-size:15px;color:var(--ink)}
ul li{margin:4px 0}
.cta{display:block;width:100%;min-height:58px;line-height:58px;text-align:center;border-radius:16px;background:var(--red);color:#fff;font-size:18px;font-weight:800;text-decoration:none}
.back{display:block;width:100%;margin-top:12px;min-height:48px;border:0;background:none;color:var(--sub);font:inherit;font-size:15px;cursor:pointer;text-decoration:underline}
.logo{margin-top:28px;text-align:center;color:#fff;font-size:26px;font-weight:900;letter-spacing:.01em}
.logo span{font-weight:400}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="eyebrow">1:1 Private</div>
    <h1 id="title">찾아가는 두피진단</h1>
    <p id="subtitle">Scalp Analysis · 头皮检测 · 頭皮診断</p>
  </div>

  <main class="card">
    <section id="select">
      <p class="pick">Select your language · 언어 선택 · 选择语言 · 言語を選択</p>
      <div class="langs">
        <button class="lang" data-l="ko"><span>한국어</span><span>›</span></button>
        <button class="lang" data-l="en"><span>English</span><span>›</span></button>
        <button class="lang" data-l="zh"><span>中文</span><span>›</span></button>
        <button class="lang" data-l="ja"><span>日本語</span><span>›</span></button>
      </div>
    </section>

    <section id="guide" hidden>
      <h2 class="sec" id="h-steps"></h2>
      <ol id="steps"></ol>
      <h2 class="sec" id="h-notes"></h2>
      <ul id="notes"></ul>
      <a class="cta" id="cta" href="#"></a>
      <button class="back" id="back"></button>
    </section>
  </main>

  <div class="logo">Dr.FOR<span>HAIR</span></div>
</div>

<script>
var CHECKLIST_URL = "https://diag.wyattcorp.com/front/intro/G";
var CHECKLIST_URLS = { ko: CHECKLIST_URL, en: CHECKLIST_URL, zh: CHECKLIST_URL, ja: CHECKLIST_URL };

var T = {
  ko: {
    title: "찾아가는 두피진단", sub: "1:1 무료 두피 진단",
    hSteps: "이용 방법", hNotes: "꼭 확인해 주세요",
    steps: ["예약 시 본인의 이메일로 호출 번호를 안내해 드립니다.", "새로고침하여 본인의 순서를 확인해 주세요.", "순서가 다가와 호출되면 진단 존으로 이동해 주세요."],
    notes: ["두피진단은 1인당 약 10분 정도 소요됩니다.", "호출 후 10분 안에 방문해 주셔야 하며, 방문하지 않을 시 자동으로 취소됩니다.", "현장 상황에 따라 예상 시간이 변동될 수 있습니다.", "개인정보 및 두피진단 결과는 외부에 공개되지 않습니다."],
    cta: "사전 체크리스트 작성", back: "언어 변경"
  },
  en: {
    title: "Free Scalp Analysis", sub: "Free 1:1 private scalp analysis",
    hSteps: "HOW IT WORKS", hNotes: "PLEASE NOTE",
    steps: ["When you reserve, your call number is sent to your email.", "Refresh the page to check your turn.", "When your number is called, please head to the analysis zone."],
    notes: ["Each analysis takes about 10 minutes per person.", "Please arrive within 10 minutes of being called, or your reservation will be cancelled automatically.", "Estimated wait times may change depending on on-site conditions.", "Your personal information and scalp analysis results are kept private and will not be disclosed externally."],
    cta: "Fill out the pre-analysis checklist", back: "Change language"
  },
  zh: {
    title: "上门头皮检测", sub: "一对一免费头皮检测",
    hSteps: "使用方法", hNotes: "请注意",
    steps: ["预约时，叫号号码将发送至您的邮箱。", "请刷新页面，查看您的排队顺序。", "轮到您并被叫号后，请前往检测区。"],
    notes: ["头皮检测每人约需10分钟。", "被叫号后请在10分钟内到场，否则预约将自动取消。", "预计等待时间可能因现场情况而有所变动。", "个人信息及头皮检测结果不会对外公开。"],
    cta: "填写检测前问卷", back: "更换语言"
  },
  ja: {
    title: "出張頭皮診断", sub: "1対1の無料頭皮診断",
    hSteps: "ご利用方法", hNotes: "ご注意ください",
    steps: ["ご予約の際、ご登録のメールアドレスに呼出番号をお送りします。", "ページを更新して、ご自身の順番をご確認ください。", "順番が近づき呼び出されましたら、診断ゾーンへお越しください。"],
    notes: ["頭皮診断は1名様あたり約10分かかります。", "呼び出し後10分以内にお越しください。お越しにならない場合は自動的にキャンセルとなります。", "現場の状況により、予想時間が変動する場合があります。", "個人情報および頭皮診断の結果は外部に公開されません。"],
    cta: "事前チェックリストを入力", back: "言語を変更"
  }
};

var $ = function (id) { return document.getElementById(id); };
var DEFAULT_TITLE = "찾아가는 두피진단", DEFAULT_SUB = "Scalp Analysis · 头皮检测 · 頭皮診断";

function show(l) {
  var t = T[l];
  if (!t) {
    $("select").hidden = false; $("guide").hidden = true;
    $("title").textContent = DEFAULT_TITLE; $("subtitle").textContent = DEFAULT_SUB;
    document.documentElement.lang = "ko";
    return;
  }
  document.documentElement.lang = l === "zh" ? "zh-CN" : l;
  $("title").textContent = t.title; $("subtitle").textContent = t.sub;
  $("h-steps").textContent = t.hSteps; $("h-notes").textContent = t.hNotes;
  $("steps").innerHTML = t.steps.map(function (s, i) { return '<li><span class="n">' + (i + 1) + '</span><span>' + s + '</span></li>'; }).join("");
  $("notes").innerHTML = t.notes.map(function (s) { return "<li>" + s + "</li>"; }).join("");
  $("cta").textContent = t.cta; $("cta").href = CHECKLIST_URLS[l];
  $("back").textContent = t.back;
  $("select").hidden = true; $("guide").hidden = false;
  window.scrollTo(0, 0);
}

document.querySelectorAll(".lang").forEach(function (b) {
  b.addEventListener("click", function () { location.hash = b.dataset.l; });
});
$("back").addEventListener("click", function () { location.hash = ""; });
window.addEventListener("hashchange", function () { show(location.hash.slice(1)); });
show(location.hash.slice(1));
</script>
</body>
</html>
